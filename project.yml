name: ReceiptDrop
options:
  bundleIdPrefix: com.dtgincorp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # Keep the project file in a format Xcode 15.2 can open —
  # newer XcodeGen defaults to the Xcode 16 format (objectVersion 77),
  # which crashes the Xcode 15.2 project editor.
  xcodeVersion: "15.2"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is intentionally unset — select your personal team
    # in Xcode under Signing & Capabilities for each target.

targets:
  ReceiptDrop:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - ReceiptDropTests
    sources:
      - ReceiptDrop
      - Shared
    dependencies:
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dtgincorp.receiptdrop
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Universal (1,2 = iPhone + iPad). UIRequiresFullScreen below opts out
        # of iPad Split View/Slide Over, which is what still allows
        # portrait-only on iPad without the ITMS-90474 delivery error.
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: ReceiptDrop/ReceiptDrop.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dtgincorp.receiptdrop
    info:
      path: ReceiptDrop/Info.plist
      properties:
        CFBundleDisplayName: Receipt Drop
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Used to take a photo of a receipt to submit.
        # Exposes Documents/Receipts in the Files app under "On My iPhone > ReceiptDrop".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dtgincorp.receiptdrop.share
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dtgincorp.receiptdrop
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Receipt Drop
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              # This is the OS-level ceiling iOS uses to decide whether to
              # offer ReceiptDrop in the share sheet at all — it is enforced
              # BEFORE the extension process launches, so it can't show any
              # message of its own. Set generously higher than the in-app
              # "friendly" batch limit (5, see ExtensionBatchSubmitView) so
              # that limit's warning actually has a chance to run instead of
              # ReceiptDrop just silently vanishing from the sheet for a
              # realistic multi-select, which is the bug this exists to fix.
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20

  ReceiptDropTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ReceiptDropTests
    # Depending on the app target makes XcodeGen auto-wire TEST_HOST +
    # BUNDLE_LOADER, so `@testable import ReceiptDrop` can reach the Shared
    # types (ExtractedReceipt, VendorTypeToken, ClaudeService) compiled into
    # the app module.
    dependencies:
      - target: ReceiptDrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dtgincorp.receiptdrop.tests
        GENERATE_INFOPLIST_FILE: YES
