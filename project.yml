name: ReceiptDrop
options:
  bundleIdPrefix: com.nicknagpal
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # Keep the project file in a format Xcode 15.2 can open —
  # newer XcodeGen defaults to the Xcode 16 format (objectVersion 77),
  # which crashes the Xcode 15.2 project editor.
  xcodeVersion: "15.2"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is intentionally unset — select your personal team
    # in Xcode under Signing & Capabilities for each target.

targets:
  ReceiptDrop:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - ReceiptDropTests
    sources:
      - ReceiptDrop
      - Shared
    dependencies:
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicknagpal.receiptdrop
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone-only (1). This is a personal iPhone app; being iPhone-only
        # exempts it from iPad's "must support all orientations" rule, so
        # portrait-only is allowed (fixes App Store delivery error ITMS-90474).
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: ReceiptDrop/ReceiptDrop.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nicknagpal.receiptdrop
    info:
      path: ReceiptDrop/Info.plist
      properties:
        CFBundleDisplayName: Receipt Drop
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Used to take a photo of a receipt to submit.
        # Exposes Documents/Receipts in the Files app under "On My iPhone > ReceiptDrop".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicknagpal.receiptdrop.share
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nicknagpal.receiptdrop
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Receipt Drop
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1

  ReceiptDropTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ReceiptDropTests
    # Depending on the app target makes XcodeGen auto-wire TEST_HOST +
    # BUNDLE_LOADER, so `@testable import ReceiptDrop` can reach the Shared
    # types (ExtractedReceipt, VendorTypeToken, ClaudeService) compiled into
    # the app module.
    dependencies:
      - target: ReceiptDrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicknagpal.receiptdrop.tests
        GENERATE_INFOPLIST_FILE: YES
