name: ReceiptDrop
options:
  bundleIdPrefix: com.datatechnologygroup
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # DATA TECHNOLOGY GROUP INC. — the app's bundle IDs and App Group are
    # registered under this team and nowhere else, so a build signed by any
    # other team cannot resolve its entitlements. Pinned here rather than
    # left to each developer's Xcode selection because that selection lives
    # only in the generated .pbxproj, and `xcodegen generate` wipes it.
    # Building requires membership in this team.
    DEVELOPMENT_TEAM: 9QPSF3ZB76

targets:
  ReceiptDrop:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - ReceiptDropTests
    sources:
      - ReceiptDrop
      - Shared
    dependencies:
      - target: ShareExtension
    # Copies the hand-verified fixtures in test-receipts/ into the app bundle
    # for DEBUG builds only, where ExtractionEvalView scores extraction
    # against their *_log.csv ground truth. 18MB of the developer's own
    # receipts has no business in a shipped binary, and XcodeGen has no
    # per-configuration `resources`, so the guard is in the script itself.
    postBuildScripts:
      - name: Bundle eval fixtures (Debug only)
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            DEST="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/TestReceipts"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            cp "$SRCROOT/test-receipts/"*.jpg "$DEST/" 2>/dev/null || true
            cp "$SRCROOT/test-receipts/"*.pdf "$DEST/" 2>/dev/null || true
            cp "$SRCROOT/test-receipts/"*_log.csv "$DEST/" 2>/dev/null || true
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datatechnologygroup.receipts4tax
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Universal (1,2 = iPhone + iPad). UIRequiresFullScreen below opts out
        # of iPad Split View/Slide Over, which is what still allows
        # portrait-only on iPad without the ITMS-90474 delivery error.
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: ReceiptDrop/ReceiptDrop.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.datatechnologygroup.receipts4tax
    info:
      path: ReceiptDrop/Info.plist
      properties:
        CFBundleDisplayName: Receipts4Tax
        # Version keys are declared explicitly because XcodeGen otherwise
        # falls back to its own defaults (1.0 / 1) when generating this
        # Info.plist. The build number MUST stay in lockstep with the
        # ShareExtension target's below — App Store Connect rejects an
        # upload whose embedded extension build number differs from the app's.
        #
        # Build numbers are scoped to the version string, which is why this
        # one restarts at 1: 1.0 reached build 5, and a build number can
        # never be reused or lowered within a version (uploading 1.0 (4)
        # again is refused even though that build was never distributed).
        # A new version string gets a fresh counter.
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # Overnight reading of receipts parked by the share extension's
        # "Save for Later" (OvernightProcessingService). Declared here, not in
        # Info.plist, which xcodegen regenerates from this file — and
        # BGTaskScheduler throws at registration if the identifier is missing,
        # so a dropped key here is a launch crash.
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.datatechnologygroup.receipts4tax.overnight
        NSCameraUsageDescription: Used to take a photo of a receipt to submit.
        # Exposes Documents/Receipts in the Files app under "On My iPhone > ReceiptDrop".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Lets the share extension hand off to the main app via
        # receiptdrop://; must stay in sync with AppConstants.urlScheme.
        # Declared here (not just hand-edited into Info.plist) because
        # `xcodegen generate` regenerates Info.plist from this file and
        # silently drops any key not declared here.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - receiptdrop

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datatechnologygroup.receipts4tax.share
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.datatechnologygroup.receipts4tax
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Receipts4Tax
        # Must match the ReceiptDrop target's version keys exactly.
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              # This is the OS-level ceiling iOS uses to decide whether to
              # offer ReceiptDrop in the share sheet at all — it is enforced
              # BEFORE the extension process launches, so it can't show any
              # message of its own. Set generously higher than the in-app
              # "friendly" batch limit (5, see ExtensionBatchSubmitView) so
              # that limit's warning actually has a chance to run instead of
              # ReceiptDrop just silently vanishing from the sheet for a
              # realistic multi-select, which is the bug this exists to fix.
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20

  ReceiptDropTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ReceiptDropTests
    # Depending on the app target makes XcodeGen auto-wire TEST_HOST +
    # BUNDLE_LOADER, so `@testable import ReceiptDrop` can reach the Shared
    # types (ExtractedReceipt, VendorTypeToken, ClaudeService) compiled into
    # the app module.
    dependencies:
      - target: ReceiptDrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datatechnologygroup.receipts4tax.tests
        GENERATE_INFOPLIST_FILE: YES
